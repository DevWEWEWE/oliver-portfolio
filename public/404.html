<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – Oliver Harris</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#02132C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@108..112,800..900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;align-content:center;padding:clamp(20px,4vw,40px);color:#fff;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.55;background:
    radial-gradient(60% 70% at 92% 18%, #2F6FE8 0%, rgba(47,111,232,0) 60%),
    radial-gradient(55% 55% at 6% 100%, #1E5BD8 0%, rgba(30,91,216,0) 62%),
    linear-gradient(160deg, #031531 0%, #02132C 55%, #04205A 100%) fixed}
  main{width:min(1180px,100%);margin-inline:auto}
  .eyebrow{font-size:13px;color:#7FCBFF;margin:0 0 18px}
  h1{margin:0 0 24px;font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-weight:900;font-variation-settings:"wdth" 112;text-transform:uppercase;font-size:clamp(3rem,.8rem + 7vw,6.6rem);line-height:.92;letter-spacing:-.01em}
  p{max-width:40ch;color:#A9BDD9;margin:0 0 24px}
  a{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:13px 22px;border-radius:50px;background:#3FB3F5;color:#02132C;text-decoration:none;transition:background-color .2s,translate .2s}
  a:hover,a:focus-visible{background:#fff}
  :focus-visible{outline:2px solid #04B5FF;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Error 404</p>
    <h1>Page not found</h1>
    <p>This page doesn't exist. It may have moved, or the link was typed slightly wrong.</p>
    <a href="/">Back to the portfolio <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
