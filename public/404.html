<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – Oliver Harris</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F0F10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;align-content:center;padding:clamp(20px,4vw,40px);color:#F3F1EC;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.55;background:#0F0F10}
  main{width:min(1180px,100%);margin-inline:auto}
  .eyebrow{font-size:14px;color:#A6A39C;margin:0 0 16px}
  h1{margin:0 0 24px;font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:clamp(3rem,1.2rem + 6vw,6rem);line-height:.95;letter-spacing:-.02em}
  p{max-width:40ch;color:#A6A39C;margin:0 0 24px}
  a{display:inline-flex;align-items:center;min-height:48px;padding:12px 24px;border-radius:4px;background:#1F6FEB;color:#fff;font-weight:500;text-decoration:none;transition:background-color .15s}
  a:hover,a:focus-visible{background:#1959C2}
  a:active{scale:.98}
  :focus-visible{outline:2px solid #6CA8FF;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Error 404</p>
    <h1>Page not found</h1>
    <p>This page doesn't exist. It may have moved, or the link was typed slightly wrong.</p>
    <a href="/">Back to the portfolio</a>
  </main>
</body>
</html>
