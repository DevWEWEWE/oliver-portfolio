<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – Oliver Harris</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F2ED">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;align-content:center;padding:clamp(20px,4vw,40px);background:#F4F2ED;color:#171915;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.55}
  main{width:min(1180px,100%);margin-inline:auto}
  .eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;margin:0 0 18px}
  h1{margin:0 0 24px;font-size:clamp(3.4rem,1rem + 7.6vw,7.2rem);line-height:.86;letter-spacing:-.075em;margin-left:-.05em}
  p{max-width:40ch;color:#63665E;margin:0 0 24px}
  a{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:13px 22px;border-radius:50px;background:#D03C1A;color:#FFF8EF;text-decoration:none;transition:background-color .2s,translate .2s}
  a:hover,a:focus-visible{background:#171915;translate:0 -2px}
  :focus-visible{outline:2px solid #D03C1A;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Error 404</p>
    <h1>Page not found.</h1>
    <p>This page doesn't exist. It may have moved, or the link was typed slightly wrong.</p>
    <a href="/">Back to the portfolio <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
